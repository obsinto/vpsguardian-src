#!/bin/bash
################################################################################
# VPS Guardian - Configuração de Destinos de Backup
# Este arquivo define onde os backups serão enviados automaticamente
################################################################################

# ========== DESTINOS HABILITADOS ==========
# Valores: true/false
BACKUP_DEST_LOCAL=true
BACKUP_DEST_SSH=false
BACKUP_DEST_GOOGLE_DRIVE=false
BACKUP_DEST_AWS_S3=false

# ========== CONFIGURAÇÕES SSH (Self-hosted) ==========
SSH_REMOTE_ENABLED=false
SSH_REMOTE_SERVER=""
SSH_REMOTE_USER="root"
SSH_REMOTE_PORT="22"
SSH_REMOTE_DIR="/root/backups"
SSH_KEY_PATH="$HOME/.ssh/id_rsa"

# ========== CONFIGURAÇÕES GOOGLE DRIVE (rclone) ==========
GDRIVE_ENABLED=false
GDRIVE_REMOTE_NAME="gdrive"  # Nome do remote configurado no rclone
GDRIVE_DIR="backups/vpsguardian/databases"

# ========== CONFIGURAÇÕES AWS S3 ==========
S3_ENABLED=false
S3_BUCKET=""  # Nome do bucket (sem s3://)
S3_PREFIX="backups/vpsguardian/databases"
S3_REGION="us-east-1"
S3_STORAGE_CLASS="STANDARD_IA"  # STANDARD, STANDARD_IA, GLACIER, etc

# ========== RETENÇÃO DE BACKUPS ==========
# Estratégia de retenção: simple, count, gfs
#   simple = deleta backups mais antigos que X dias
#   count = mantém últimos X backups
#   gfs = Grandfather-Father-Son (7 diários, 4 semanais, 12 mensais)
BACKUP_RETENTION_STRATEGY="simple"

# Dias para estratégia 'simple' (padrão: 30)
BACKUP_RETENTION_DAYS=30

# Quantidade para estratégia 'count' (padrão: 10)
BACKUP_RETENTION_COUNT=10

# Após upload bem-sucedido, manter backup local?
REMOVE_LOCAL_AFTER_UPLOAD=false

# ========== OPÇÕES DE BACKUP ==========
# Incluir banco de dados do Coolify (coolify-db) nos backups automáticos?
# true = incluir (recomendado), false = excluir
BACKUP_INCLUDE_COOLIFY=true

# ========== NOTIFICAÇÕES ==========
# Webhook para notificações (Discord, Slack, etc)
WEBHOOK_URL=""

# Email para notificações (requer mailutils instalado)
NOTIFICATION_EMAIL=""
